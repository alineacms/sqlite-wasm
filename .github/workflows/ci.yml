name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native extension
    uses: ./.github/workflows/native.yml

  build:
    name: Build and test
    needs: native
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build and test Wasm package
        uses: ./.github/actions/build
      # OPFS and snapshot storage need a browser: run test/browser
      # in Chromium on the runner, against the package built above.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Test in Chromium
        run: |
          bunx playwright-core install --with-deps chromium
          bun run test:browser
      # The same packaging steps as the release, without publishing.
      - name: Collect native binaries
        uses: ./.github/actions/collect-native
