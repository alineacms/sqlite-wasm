name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native extension
    uses: ./.github/workflows/native.yml

  build:
    name: Build and test
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Build and test Wasm package
        uses: ./.github/actions/build
      # The same packaging steps as the release, without publishing.
      - name: Collect native binaries
        uses: ./.github/actions/collect-native
