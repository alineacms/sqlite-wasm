name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Native extension
    uses: ./.github/workflows/native.yml

  publish:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.13.0
      - name: Verify release tag matches package version
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs'
          const {version} = JSON.parse(readFileSync('package.json', 'utf8'))
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`Release tag must be v${version}`)
          }
          NODE
      - name: Build and test Wasm package
        uses: ./.github/actions/build
      - name: Remove locally built native binaries
        run: sudo rm -rf dist/native
      - name: Download prebuilt native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist/native
      - name: Arrange native binaries by target
        run: |
          for dir in dist/native/native-*; do
            mv "$dir" "dist/native/${dir#dist/native/native-}"
          done
          ls -R dist/native
      - name: Publish to npm
        run: npm publish --access public
