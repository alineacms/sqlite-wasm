name: Build and test SQLite Wasm
description: Builds and tests the package with the pinned devcontainer toolchain
runs:
  using: composite
  steps:
    - name: Build toolchain image
      shell: bash
      run: docker build --tag sqlite-wasm-ci .devcontainer
    - name: Install dependencies, build, and test
      shell: bash
      run: |
        docker run --rm \
          --volume "$GITHUB_WORKSPACE:/github/workspace" \
          --workdir /github/workspace \
          --env GITHUB_WORKSPACE=/github/workspace \
          --env CI=true \
          sqlite-wasm-ci bash -lc 'bash .github/actions/build/entrypoint.sh'
